services:
  unirule:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - unirule_data:/data
    environment:
      NODE_ENV: production
      CONFIG_PATH: /data/config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  unirule_data:
